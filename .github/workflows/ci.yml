name: Check and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: rag
          POSTGRES_DB: rag
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://rag:ci-only-password@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.12.17
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q --cov=app --cov-report=term-missing
      - run: docker build -t nimble-rag:ci .
      - run: python scripts/setup_env.py
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: curl --fail http://127.0.0.1:8000/health/ready
      - name: Show container logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then docker compose logs --tail 100; fi
      - if: always()
        run: |
          if [ -f .env ]; then docker compose down -v; fi
