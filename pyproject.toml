[project]
name = "nimble-rag-agent"
version = "0.1.0"
description = "A teachable FastAPI and LangGraph document assistant with Qdrant RAG"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
  "langchain-openai>=1,<2", "qdrant-client>=1.16,<2",
  "psycopg[binary,pool]>=3.2,<4", "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7", "prometheus-client>=0.21,<1", "httpx>=0.28,<1"
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "pyyaml>=6,<7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a real PostgreSQL database"]
